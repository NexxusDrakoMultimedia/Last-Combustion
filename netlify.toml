#
# The beta site (beta.lc.nexxusdrako.au). Netlify builds the `beta` branch, which is moved to the commit
# of each `v0.2.0-beta*` tag (see docs/RELEASING.md, "Beta releases"), and also builds branch deploys.
# The release site on GitHub Pages is built from `main` by .github/workflows/pages.yml and does not use
# this file. No telemetry keys are set here or in Netlify, so nothing built from this file collects data.

[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Served from the root of a custom domain, not a sub-path.
  BASE_URL = "/"

# Everything built from this file is for testing, so keep it out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
