version = 1
SPDX-PackageName = "Last Combustion"
SPDX-PackageSupplier = "Nexxus Drako Multimedia"
SPDX-PackageDownloadLocation = "https://github.com/NexxusDrakoMultimedia/Last-Combustion"

# Files that cannot carry a comment header (data, configuration, documents, lockfiles).
[[annotations]]
path = [
  "**/*.md",
  "**/*.json",
  "**/*.jsonc",
  "**/*.yml",
  "**/*.yaml",
  "**/*.toml",
  "**/*.html",
  ".gitignore",
  ".editorconfig",
  ".nvmrc",
  ".prettierignore",
  ".prettierrc.json",
  ".husky/**",
  ".github/CODEOWNERS",
  "public/CNAME",
  "pnpm-lock.yaml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Nexxus Drako Multimedia"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Route outlines derived from OpenStreetMap data.
[[annotations]]
path = "data/courses/outlines.json"
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors; Nexxus Drako Multimedia"
SPDX-License-Identifier = "ODbL-1.0"

# The Vyktory flag easter egg (a fictional nation of Nexxus Drako Multimedia).
[[annotations]]
path = "assets/flags/**"
precedence = "override"
SPDX-FileCopyrightText = "Nexxus Drako Multimedia"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The brand assets: the logo, favicons, social images, profile art and screenshots. The name and the logo
# are trademarks of Nexxus Drako Multimedia (see TRADEMARKS.md); the files are covered by the GPL as copyright works.
[[annotations]]
path = ["assets/brand/**", "public/favicon.svg", "public/*.png", "public/site.webmanifest"]
precedence = "override"
SPDX-FileCopyrightText = "Nexxus Drako Multimedia"
SPDX-License-Identifier = "GPL-3.0-or-later"
