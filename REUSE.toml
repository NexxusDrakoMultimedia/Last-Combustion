version = 1
SPDX-PackageName = "Last Combustion"
SPDX-PackageSupplier = "Nexxus Drako Multimedia"
SPDX-PackageDownloadLocation = "https://github.com/NexxusDrakoMultimedia/Last-Combustion"

# Files that cannot carry a comment header (data, configuration, documents, lockfiles).
[[annotations]]
path = [
  "**/*.md",
  "**/*.json",
  "**/*.jsonc",
  "**/*.yml",
  "**/*.yaml",
  "**/*.toml",
  "**/*.html",
  ".gitignore",
  ".editorconfig",
  ".nvmrc",
  ".prettierignore",
  ".prettierrc.json",
  ".husky/**",
  ".github/CODEOWNERS",
  "public/CNAME",
  "pnpm-lock.yaml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Nexxus Drako Multimedia"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Route outlines derived from OpenStreetMap data.
[[annotations]]
path = "data/courses/outlines.json"
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors; Nexxus Drako Multimedia"
SPDX-License-Identifier = "ODbL-1.0"

# The Vyktory flag easter egg (a fictional nation of Nexxus Drako Multimedia).
[[annotations]]
path = "assets/flags/**"
precedence = "override"
SPDX-FileCopyrightText = "Nexxus Drako Multimedia"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The brand art: the logo, favicons, social images and profile art. The files are licensed CC BY-SA 4.0, which
# is one-way compatible with GPL-3.0 (art under it can be used in this GPL project). The name and the logo are
# still trademarks of Nexxus Drako Multimedia: the licence does not grant them (see TRADEMARKS.md).
[[annotations]]
path = ["assets/brand/**", "public/favicon.svg", "public/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "Nexxus Drako Multimedia"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Screenshots are pictures of the game itself, so they stay under the GPL with the rest of the project, as does
# the web manifest.
[[annotations]]
path = ["assets/brand/screenshots/**", "public/site.webmanifest"]
precedence = "override"
SPDX-FileCopyrightText = "Nexxus Drako Multimedia"
SPDX-License-Identifier = "GPL-3.0-or-later"
